# تقرير تسويقي من Google Analytics 4 مباشرة (بدون Claude).
# يعمل عند الطلب فقط (من تبويب Actions ← Run workflow).
# يحتاج:
#   - سر GA_SERVICE_ACCOUNT_JSON: محتوى ملف JSON لحساب الخدمة (Viewer على خاصية GA4)
#   - متغير GA_PROPERTY_ID: رقم خاصية GA4 (أرقام فقط)
name: Marketing analytics report
on:
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Build GA4 report and open an issue
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ga-report.mjs
